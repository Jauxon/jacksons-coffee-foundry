# Auto-deploy to the DigitalOcean droplet on every push to master — replicates
# Railway's git-push DX. SSHes in and runs deploy/deploy.sh.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST     -> the droplet's IP or hostname
#   DROPLET_USER     -> usually "root" (or a deploy user with sudo)
#   DROPLET_SSH_KEY  -> a PRIVATE key whose public half is in the droplet's
#                       ~/.ssh/authorized_keys
name: Deploy to Droplet

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            sudo bash /srv/coffee/deploy/deploy.sh
